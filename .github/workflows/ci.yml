name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request stops the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Vitest 5 needs Node.js 22.12 or later. The workflow uses Node.js 24.
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Show the files in the package
        run: npm pack --dry-run

  example:
    name: Build the example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/basic
    steps:
      - name: Get the source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The example has no package-lock.json. Thus the workflow does not use the npm cache.
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # With --install-links, npm packs the package and installs it as from the registry.
      # Thus the build fails if a necessary file is not in the package.
      - name: Install the dependencies of the example
        run: npm install --install-links

      - name: Bundle the example with Wrangler
        run: npx wrangler deploy --dry-run --outdir dist
