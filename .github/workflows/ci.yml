name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request stops the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each "uses:" refers to a full commit SHA, not to a tag.
# A tag can move to different code, but a commit SHA cannot change.
# Dependabot updates each commit SHA and its version comment. See .github/dependabot.yml.
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vitest 5 needs Node.js 22.12 or later. The workflow uses Node.js 24.
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Run the type tests
        run: npm run test:types

      - name: Run the type tests with TypeScript 5
        run: npm run test:types:compat

      - name: Make sure that the package has only the expected files
        run: npm run check:package

  example:
    name: Build the example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/basic
    steps:
      - name: Get the source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The example has no package-lock.json. Thus the workflow does not use the npm cache.
      - name: Install Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # With --install-links, npm packs the package and installs it as from the registry.
      # Thus the build fails if a necessary file is not in the package.
      - name: Install the dependencies of the example
        run: npm install --install-links

      - name: Bundle the example with Wrangler
        run: npx wrangler deploy --dry-run --outdir dist
